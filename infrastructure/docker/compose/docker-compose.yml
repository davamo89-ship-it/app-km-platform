name: appkm-platform

services:

  postgres:

    image: postgres:16

    container_name: appkm-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: appkm
      POSTGRES_USER: appkm
      POSTGRES_PASSWORD: appkm

    ports:
      - "${APPKM_POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appkm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres-data: